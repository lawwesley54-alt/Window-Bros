<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Window Bros | Residential Window Cleaning in Salado, TX</title>

      name="description"
      content="Window Bros provides professional residential window cleaning for homeowners in Salado, TX. Get a free, no-obligation quote today."
    />
    <link rel="canonical" href="https://www.windowbros.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Window Bros" />
    <meta property="og:title" content="Window Bros | Residential Window Cleaning" />
    <meta
      property="og:description"
      content="Professional window cleaning for homeowners who want cleaner windows without the hassle. Get a free quote from Window Bros."

    <meta property="og:image" content="https://www.windowbros.example/logo.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Window Bros | Residential Window Cleaning" />
    <meta
      name="twitter:description"
      content="Professional window cleaning for homeowners who want cleaner windows without the hassle."
    />
    <meta name="twitter:image" content="https://www.windowbros.example/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      LocalBusiness structured data. Keep this in sync with
      src/config/site.ts. The street address and postal code are still
      placeholders — fill those in before launch. Do not invent ratings,
      review counts, years in business, or pricing.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Window Bros",
        "description": "Professional residential window cleaning for homeowners.",
        "image": "https://www.windowbros.example/logo.png",
        "telephone": "+1-512-995-9966",
        "email": "broswimdow4@gmail.com",
        "url": "https://www.windowbros.example/",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[STREET ADDRESS]",
          "addressLocality": "Salado",
          "addressRegion": "TX",
          "postalCode": "[ZIP]",
          "addressCountry": "US"
        },
        "areaServed": "Salado, TX",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Exterior Window Cleaning" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Interior Window Cleaning" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Screen Cleaning" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
